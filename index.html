<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Maqueta visual del centro de control SHOW ROOM de myRockomix SHOW." />
    <title>myRockomix SHOW · SHOW ROOM</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/show-room.css" />
  </head>
  <body>
    <main class="showroom-shell" aria-labelledby="showroom-title">
      <header class="app-header">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M7.6 18.5 18.5 7.6M5.3 8.1l2.1-2.8 3 1.1 1.3-1.3-1.1-3L13.4 1l2.8 2.1-1.1 3 1.3 1.3 3-1.1 1.1 2.8-2.1 2.8 1.1 3-2.8 1.1-2.8-2.1-1.3 1.3 1.1 3-2.8 1.1-2.8-2.1-3 1.1-1.1-2.8 2.1-2.8-1.3-1.3-3 1.1-1.1-2.8 2.1-2.8 3 1.1 1.3-1.3-1.1-3Z" /><circle cx="12" cy="12" r="2.3" /></svg>
          </span>
          <div>
            <h1 id="showroom-title">myRockomix SHOW</h1>
            <p class="room-label">SHOW ROOM</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="mode-toggle" class="mode-toggle" type="button" aria-label="Cambiar a modo MINI">MINI</button>
          <button class="settings-button" type="button" aria-label="Opciones, próximamente" title="Opciones próximamente">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 15.2A3.2 3.2 0 1 0 12 8.8a3.2 3.2 0 0 0 0 6.4Zm8-3.2 2-1.5-2-3.5-2.4 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6h-4L11 7a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7.8 7.8 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7.8 7.8 0 0 0 0-2Z" /></svg>
          <span>OPCIONES</span>
          </button>
        </div>
      </header>

      <section class="module-grid" aria-label="Módulos de SHOW ROOM">
        <article class="module-card pad-card">
          <div class="module-layout">
            <section class="module-info" aria-label="Información de SHOW PAD">
              <header class="module-header">
                <span class="module-selector" aria-label="Módulo SHOW PAD"></span>
                <span class="module-icon" aria-hidden="true" title="SHOW PAD"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" /><path d="M8 8h.01M16 8h.01M8 16h.01M16 16h.01" /></svg></span>
                <div><h2>SHOW PAD</h2><p>Controlador MIDI</p></div>
              </header>
              <div class="module-detail pad-detail">
                <button id="midi-toggle" class="module-toggle" type="button" aria-label="Activar recepción MIDI en PC" aria-pressed="false"><span class="toggle-track" aria-hidden="true"><i></i></span><strong>INACTIVO</strong></button>
              </div>
            </section>
            <section class="module-controls pad-controls" aria-label="Controles de SHOW PAD">
              <label class="control-label" for="midi-device">DISPOSITIVO MIDI</label>
              <select id="midi-device" aria-label="Dispositivo MIDI"><option value="">Activa MIDI para buscar dispositivos</option></select>
              <span id="midi-hint" class="control-hint">ENGINE · MIDI DESACTIVADO</span>
            </section>
          </div>
        </article>

        <article class="module-card score-card">
          <div class="module-layout">
            <section class="module-info" aria-label="Información de SHOW SCORE">
              <header class="module-header">
                <span class="module-selector" aria-label="Módulo SHOW SCORE"></span>
                <span class="module-icon" aria-hidden="true" title="SHOW SCORE"><svg viewBox="0 0 24 24"><path d="m12 3 2.6 5.4 5.9.9-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.9L12 3Z" /></svg></span>
                <div><h2>SHOW SCORE</h2><p>Calificación de shows</p></div>
              </header>
            </section>
            <section class="module-controls score-actions" aria-label="Controles de SHOW SCORE">
              <button id="open-score-window" class="button button-score-primary" type="button">CALIFICAR</button>
              <button id="open-score-window-ten" class="button button-score-ten" type="button" aria-label="Calificar con puntuación explícita de 10">10</button>
            </section>
          </div>
        </article>

        <article class="module-card banner-card">
          <div class="module-layout">
            <section class="module-info" aria-label="Información de SHOW BANNER">
              <header class="module-header">
                <span class="module-selector" aria-label="Módulo SHOW BANNER"></span>
                <span class="module-icon" aria-hidden="true" title="SHOW BANNER"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v13H4zM4 9h16M8 5.5v13" /><path d="m12 14 2.2-2.2 2.6 2.7" /></svg></span>
                <div><h2>SHOW BANNER</h2><p>Cintillos y mensajes</p></div>
              </header>
              <div class="banner-editor">
                <label class="message-field banner-message">
                  <span class="sr-only">Texto del cintillo</span>
                  <input type="text" placeholder="Escribe un mensaje…" autocomplete="off" />
                  <button class="message-send" type="button" aria-label="Enviar texto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4 18-7Z" /></svg></button>
                </label>
              </div>
            </section>
            <section class="module-controls banner-actions" aria-label="Controles de SHOW BANNER">
              <button class="button button-banner" type="button">LANZAR</button>
              <select class="banner-duration" aria-label="Duración del banner">
                <option selected>0</option>
                <option>25</option>
                <option>90</option>
                <option>120</option>
              </select>
            </section>
          </div>
        </article>

        <article class="module-card fx-card">
          <div class="module-layout">
            <section class="module-info" aria-label="Información de SHOW FX">
              <header class="module-header">
                <span class="module-selector" aria-label="Módulo SHOW FX"></span>
                <span class="module-icon" aria-hidden="true" title="SHOW FX"><svg viewBox="0 0 24 24"><path d="M5 14h3l4 4V6l-4 4H5zM16 9.5a4 4 0 0 1 0 5M18.5 7a7.5 7.5 0 0 1 0 10" /></svg></span>
                <div><h2>SHOW FX</h2><p>Efectos de sonido</p></div>
              </header>
            </section>
            <section class="module-controls fx-actions" aria-label="Controles de SHOW FX">
              <button class="button button-fx-primary" id="play-fx" type="button">kikekaraoke-envivo</button>
              <button class="button button-fx-assigned" type="button"><strong>ABRIR ARCHIVO</strong></button>
              <input id="fx-file-input" type="file" accept="audio/*" hidden />
            </section>
          </div>
        </article>
      </section>
      <p class="interface-note">MAQUETA VISUAL · CONFIGURACIÓN Y OPERACIÓN DISPONIBLES PRÓXIMAMENTE</p>
    </main>
    <script src="js/app.js"></script>
    <script src="js/show-room.js"></script>
  </body>
</html>
