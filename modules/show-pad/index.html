.pad.p-emerald{border-color:rgba(110,231,183,.35);background:rgba(52,211,153,.12)}

r{background:#ffffff0d}.sound-item small{color:#8995a3;font-size:10px}.sound-row{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px;align-items:center}.sound-row.personal{grid-template-columns:minmax(0,1fr) 34px 34px}.remove-audio{border-color:#684047;background:#2b1b20;color:#ff9ba2;font-size:19px;line-height:1}.remove-audio:hover{background:#49232a}.preview{height:32px;width:34px;border:1px solid #3b5268;border-radius:6px;background:#1b2a38;color:#a9d5fa;cursor:pointer}.preview:hover{background:#29445d}.section-label{padding:8px 7px 4px;color:#929daa;font-size:9px;font-weight:900;letter-spacing:1.2px}.empty{padding:12px;color:#929daa;font-size:11px}

<body>
<main class="app">
<header class="top"><div><h1>Show Pad</h1><div class="sub">ROCKOMIX</div></div><div class="top-actions"><div class="tag">SHOW PAD</div><button class="config-file" id="configFileButton" type="button">VINCULAR JSON</button><button class="load-fx" id="loadFxButton" type="button">↻ CARGAR FX´S</button></div></header>
<section class="controls">
 <div class="device"><label class="label" for="midiDevice">DISPOSITIVO MIDI</label><select id="midiDevice"><option value="">Buscando dispositivos MIDI…</option></select></div>
 <div><span class="label">ESTADO MIDI</span><div class="status" id="status"><i class="dot"></i><span id="statusText">SIN CONECTAR</span></div></div>
 <div><span class="label">CONTROL</span><button class="power" id="power" disabled>⏻ INICIAR</button></div>
</section>
<section class="panel">
 <div class="heading"><h2>BANCO DE PADS</h2><nav class="pages" id="pages"><button class="page active" data-page="1">1</button><button class="page" data-page="2">2</button><button class="page add" data-add aria-label="Crear página">+</button></nav></div>
 <div class="grid" id="padGrid"></div><div class="foot"><span id="pageLabel">PÁGINA 1</span><span>16 POSICIONES · 4 × 4</span></div>

</main>

  <option value="score">CALIFICACIÓN NORMAL</option>

 </select></div>
 <button class="action" id="chooseSound"><span class="ico">♫</span>Asignar sonido</button>
 <button class="action" id="toggleVolume"><span class="ico">◖</span>Volumen <span id="volumeText" style="margin-left:auto;color:#aab9c8">100%</span></button>

 <div class="subpanel" id="soundPanel" hidden><input class="search" id="soundSearch" type="search" placeholder="Buscar sonido..."><button class="action add-local-audio" id="addLocalAudio" type="button"><span class="ico">＋</span>Agregar audios de este dispositivo</button><input id="localAudioInput" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac" multiple hidden><div class="sound-list" id="soundList"></div></div>
 <button class="action danger" id="clearPad"><span class="ico">⌫</span>Liberar asignación</button>
</aside>

<script>
'use strict';
const IS_COMPACT_VIEW=new URLSearchParams(window.location.search).get('view')==='pads';
if(IS_COMPACT_VIEW)document.documentElement.classList.add('compact-mode');
// ── CATÁLOGO LOCAL: todos los MP3 viven dentro de assets/audio. ──
const soundFiles=[
'/sounds/buzzer.mp3','/sounds/fx_califica/10_aplusos.mp3','/sounds/fx_califica/6_dun_dun_dun.mp3','/sounds/fx_califica/6_grillos.mp3','/sounds/fx_califica/7_aww.mp3','/sounds/fx_califica/7_sad_music.mp3','/sounds/fx_califica/7_titanic_flauta.mp3','/sounds/fx_califica/8_chiquillos.mp3','/sounds/fx_califica/8_risa_kid.mp3','/sounds/fx_califica/9_ultrainstinto.mp3','/sounds/fx_califica/9_wow.mp3','/sounds/fx_califica/ding_ding_ding_mezcla.mp3','/sounds/fxs/fanfarrias.mp3','/sounds/fxs/intro_sonido_karaomix.mp3','/sounds/fxs/kikekaraoke-envivo.mp3','/sounds/fxs/la_fiesta_tiene_luz.mp3','/sounds/fxs/mambos_socios_del_ritmo.mp3','/sounds/fxs/parrapapa.mp3','/sounds/fxs/promo_reggaeton.mp3'];
const padOrder=[13,14,15,16,9,10,11,12,5,6,7,8,1,2,3,4];
const DEFAULT_CONFIG={version:1,assignments:[
{page:1,padId:1,path:'/sounds/buzzer.mp3',volume:100},{page:1,padId:2,path:'/sounds/fxs/fanfarrias.mp3',volume:100},{page:1,padId:3,path:'/sounds/fxs/parrapapa.mp3',volume:100},{page:1,padId:4,path:'/sounds/fx_califica/10_aplusos.mp3',volume:100},{page:1,padId:5,path:'/sounds/fx_califica/6_dun_dun_dun.mp3',volume:100},{page:1,padId:6,path:'/sounds/fx_califica/6_grillos.mp3',volume:100},{page:1,padId:7,path:'/sounds/fx_califica/7_aww.mp3',volume:100},{page:1,padId:8,path:'/sounds/fx_califica/7_sad_music.mp3',volume:100},{page:1,padId:9,path:'/sounds/fx_califica/7_titanic_flauta.mp3',volume:100},{page:1,padId:10,path:'/sounds/fx_califica/8_chiquillos.mp3',volume:100},{page:1,padId:11,path:'/sounds/fx_califica/8_risa_kid.mp3',volume:100},{page:1,padId:12,path:'/sounds/fx_califica/9_ultrainstinto.mp3',volume:100},{page:1,padId:13,path:'/sounds/fx_califica/9_wow.mp3',volume:100},{page:1,padId:14,path:'/sounds/fx_califica/ding_ding_ding_mezcla.mp3',volume:100},{page:1,padId:15,path:'/sounds/fxs/intro_sonido_karaomix.mp3',volume:100},{page:1,padId:16,path:'/sounds/fxs/la_fiesta_tiene_luz.mp3',volume:100}]};
const assignments={},padActions={};let currentPage=1,activePad=null,midiAccess=null,selectedMidi=null,midiStarted=false;
const audioCache=new Map(),activeVoices=new Map(),failedPads=new Set(),failedAudioPaths=new Set(),pendingPadStarts=new Map();let previewVoice=null;
// ── AUDIOS PERSONALES: blobs persistentes por navegador/dispositivo mediante IndexedDB. ──
const PERSONAL_AUDIO_DB='myrockomix-show-pad-library',PERSONAL_AUDIO_STORE='audios';
const localAudioRecords=new Map(),localAudioUrls=new Map();let personalAudiosReady=false;
function openPersonalAudioDb(){return new Promise((resolve,reject)=>{const request=indexedDB.open(PERSONAL_AUDIO_DB,1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(PERSONAL_AUDIO_STORE)){const store=request.result.createObjectStore(PERSONAL_AUDIO_STORE,{keyPath:'id'});store.createIndex('name','name',{unique:false})}};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function loadPersonalAudios(){try{const db=await openPersonalAudioDb();const records=await new Promise((resolve,reject)=>{const tx=db.transaction(PERSONAL_AUDIO_STORE,'readonly');const request=tx.objectStore(PERSONAL_AUDIO_STORE).getAll();request.onsuccess=()=>resolve(request.result||[]);request.onerror=()=>reject(request.error)});db.close();records.forEach(record=>{localAudioRecords.set(record.id,record);localAudioUrls.set(record.id,URL.createObjectURL(record.blob))})}catch(error){console.error('SHOW PAD: no se pudo leer la biblioteca personal',error)}}
async function storePersonalAudio(file){const id=`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`;const record={id,name:file.name,type:file.type||'audio/mpeg',size:file.size,addedAt:Date.now(),blob:file};const db=await openPersonalAudioDb();await new Promise((resolve,reject)=>{const tx=db.transaction(PERSONAL_AUDIO_STORE,'readwrite');tx.objectStore(PERSONAL_AUDIO_STORE).put(record);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();localAudioRecords.set(id,record);localAudioUrls.set(id,URL.createObjectURL(file));return `local-audio:${id}`}
// Elimina un audio personal del dispositivo y libera sus referencias para evitar pads en rojo.

$('localAudioInput').addEventListener('change',async event=>{const files=[...(event.target.files||[])];if(!files.length)return;let added=0,firstPath=null;const targetPad=activePad;const targetPage=currentPage;try{for(const file of files){if(!file.type.startsWith('audio/')&&!/\.(mp3|wav|ogg|m4a|aac|flac)$/i.test(file.name))continue;const path=await storePersonalAudio(file);if(!firstPath)firstPath=path;added++}await requestPersistentStorage();if(firstPath&&targetPad!==null){const key=`${targetPage}:${targetPad}`;assignments[key]={...assignments[key],path:firstPath,volume:assignments[key]?.volume??100};failedPads.delete(key);failedAudioPaths.delete(firstPath);saveAssignments();renderPads();preloadPath(firstPath);closeMenu();showError(`${added} audio(s) guardado(s). ${audioDisplayName(firstPath)} asignado a PAD ${targetPad}.`)}else{renderSoundList();showError(`${added} audio(s) guardado(s) en este dispositivo. Selecciona uno de la lista para asignarlo.`)}}catch(error){console.error(error);showError('No se pudieron guardar todos los audios. Revisa el espacio disponible del dispositivo.')}finally{event.target.value=''}});
soundSearch.addEventListener('input',renderSoundList);
$('clearPad').onclick=()=>{if(activePad===null)return;const key=`${currentPage}:${activePad}`;const voice=activeVoices.get(key);if(voice){voice.howl.stop(voice.soundId);activeVoices.delete(key)}delete assignments[key];failedPads.delete(key);saveAssignments();if(currentPage>2&&!pageHasAssignments(currentPage)){currentPage=1;$('pageLabel').textContent='PÁGINA 1'}ensurePageButtons();pages.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',Number(x.dataset.page)===currentPage));renderPads();closeMenu()};
// ── MIDI REAL: actividad, selección automática y traducción MIDI → Id_pad. ──
const device=$('midiDevice'),power=$('power'),status=$('status'),statusText=$('statusText');
const MIDI_DEVICE_KEY='myrockomix-show-pad-midi-device';
const MIDI_PROFILES=[
 {id:'m-vave-smc-pad-pocket',label:'SMC-PAD Pocket',match:/smc[\s-]*pad[\s-]*pocket/i,firstNote:36,pads:16,banks:7,offset:16},
 {id:'m-vave-smc-pad',label:'SMC-PAD',match:/^smc[\s-]*pad(\s+(midi|port))?(\s+\d+)?$/i,firstNote:36,pads:16,banks:1,offset:16},
 {id:'m-vave-smc-mixer',label:'SMC-Mixer',match:/smc[\s-]*mixer/i,pads:0}
];
let rememberedMidi=null;
const midiActivity=new Map();
try{rememberedMidi=JSON.parse(localStorage.getItem(MIDI_DEVICE_KEY)||'null')}catch{rememberedMidi=null}
function midiProfile(input){if(input?.id?.startsWith('ble:'))return MIDI_PROFILES[0];return MIDI_PROFILES.find(profile=>profile.match.test(input?.name||''))||null}
function setMidiStatus(on,text){midiStarted=on;status.classList.toggle('on',on);statusText.textContent=text;power.textContent=on?'⏻ DESCONECTAR':'⏻ INICIAR';power.classList.toggle('off',on)}
function rememberMidiDevice(input){if(!input)return;rememberedMidi={id:input.id,name:input.name||'',manufacturer:input.manufacturer||''};try{localStorage.setItem(MIDI_DEVICE_KEY,JSON.stringify(rememberedMidi))}catch{}}
function findRememberedMidi(inputs){if(!rememberedMidi)return null;return inputs.find(input=>input.id===rememberedMidi.id)||inputs.find(input=>(input.name||'')===rememberedMidi.name&&(input.manufacturer||'')===rememberedMidi.manufacturer)||null}
function activeMidiInputs(){return [...(midiAccess?.inputs.values()||[])].filter(input=>input.state!=='disconnected'&&midiActivity.has(input.id))}
function renderMidiDevices(){const oldValue=device.value;const active=activeMidiInputs();device.innerHTML='';const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent=active.length?'Selecciona un dispositivo MIDI':'Esperando actividad MIDI…';device.append(placeholder);active.forEach(input=>{const option=document.createElement('option');option.value=input.id;const profile=midiProfile(input);option.textContent=profile?`${input.name} · ${profile.label}`:(input.name||`Dispositivo MIDI ${input.id}`);device.append(option)});const preferred=active.find(input=>input.id===oldValue)||findRememberedMidi(active);if(preferred){device.value=preferred.id;power.disabled=false;if(!midiStarted)connectMidi(true)}else{device.value='';power.disabled=!navigator.bluetooth;if(!active.length&&!midiStarted)statusText.textContent=navigator.bluetooth?'LISTO PARA CONEXIÓN BLUETOOTH MIDI':'ESPERANDO ACTIVIDAD MIDI'}}
function midiNoteToPad(input,note){const profile=midiProfile(input);if(!profile||profile.pads!==16)return null;const offset=note-profile.firstNote;if(offset<0||offset>=profile.banks*profile.offset)return null;return (offset%profile.offset)+1}
function handleMidiMessage(input,event){const data=event.data;if(!data||data.length<2)return;const command=data[0]&0xf0;const note=data[1];const velocity=data[2]||0;const hasActivity=[0x80,0x90,0xa0,0xb0,0xc0,0xd0,0xe0].includes(command);if(!hasActivity)return;const firstActivity=!midiActivity.has(input.id);midiActivity.set(input.id,Date.now());if(firstActivity)renderMidiDevices();if(!midiStarted||selectedMidi?.id!==input.id)return;if(command===0x90&&velocity>0){const padId=midiNoteToPad(input,note);if(padId){statusText.textContent=`${midiProfile(input).label} · PAD ${String(padId).padStart(2,'0')}`;playPad(padId)}else{statusText.textContent=`NOTA MIDI ${note} · SIN MAPEO`}}}
function monitorMidiInput(input){input.onmidimessage=event=>handleMidiMessage(input,event)}
// ── BLE MIDI DIRECTO: Chrome se conecta al controlador sin app intermediaria. ──
const BLE_MIDI_SERVICE='03b80e5a-ede8-4b33-a751-6ce34ec4c700';
const BLE_MIDI_CHARACTERISTIC='7772e5db-3868-4112-a1a9-f2669d106bf3';
let bleDevice=null,bleServer=null,bleCharacteristic=null;const bleDisconnectListeners=new WeakSet();
function midiInputLike(name,id){return {id,name,manufacturer:'M-VAVE',state:'connected',type:'input'};}
// Decodifica BLE-MIDI: cada mensaje puede venir precedido por su timestamp.
function parseBleMidiPacket(input,buffer){
 const bytes=new Uint8Array(buffer);if(bytes.length<3)return;
 let i=0,runningStatus=null;
 // El primer byte es el encabezado/timestamp alto del paquete BLE-MIDI.
 if((bytes[i]&0x80)===0)return;i++;
 while(i<bytes.length){
  // Timestamp bajo (bit 7 a 1); puede aparecer antes de cada mensaje.
  if(i>=bytes.length)break;
  if((bytes[i]&0x80)!==0){i++;if(i>=bytes.length)break;}
  let statusByte=bytes[i];
  if(statusByte&0x80){statusByte=bytes[i++];if(statusByte<0xf0)runningStatus=statusByte;}
  else if(runningStatus!==null){statusByte=runningStatus;}
  else{break;}
  const command=statusByte&0xf0;
  if(command===0xf0){break;}
  const length=(command===0xc0||command===0xd0)?1:2;
  if(i+length>bytes.length)break;
  const data=[statusByte];
  for(let n=0;n<length;n++)data.push(bytes[i++]);
  handleMidiMessage(input,{data:new Uint8Array(data)});
 }
}
function bleOptionLabel(d){return `${d.name||'SMC-PAD Pocket'} · BLE MIDI`;}
function renderBleDevices(devices=[]){
 const current=device.value;const midi=activeMidiInputs();device.innerHTML='';
 const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Selecciona tu dispositivo MIDI';device.append(placeholder);
 midi.forEach(input=>{const o=document.createElement('option');o.value=input.id;o.textContent=`${input.name} · MIDI`;device.append(o)});
 devices.forEach(d=>{const o=document.createElement('option');o.value=`ble:${d.id}`;o.textContent=bleOptionLabel(d);device.append(o)});
 const wanted=current||rememberedMidi?.id;
 if(wanted&&[...device.options].some(o=>o.value===wanted))device.value=wanted;
 else if(rememberedMidi?.name){const match=[...device.options].find(o=>o.textContent.includes(rememberedMidi.name));if(match)device.value=match.value;}
 power.disabled=false;
}
async function getAuthorizedBleDevices(){
 if(!navigator.bluetooth?.getDevices)return [];
 try{return await navigator.bluetooth.getDevices()}catch{return []}
}
async function attachBleDevice(d,automatic=false){
 if(!d?.gatt)throw new Error('El navegador no permite conectar con este dispositivo.');
 power.disabled=true;statusText.textContent=automatic?'RECONECTANDO SMC-PAD…':'CONECTANDO SMC-PAD…';
 try{
  bleDevice=d;
  if(!bleDisconnectListeners.has(d)){d.addEventListener('gattserverdisconnected',()=>{bleServer=null;bleCharacteristic=null;selectedMidi=null;setMidiStatus(false,'BLUETOOTH DESCONECTADO');power.disabled=false;});bleDisconnectListeners.add(d)}
  bleServer=d.gatt.connected?d.gatt:await d.gatt.connect();
  const service=await bleServer.getPrimaryService(BLE_MIDI_SERVICE);
  bleCharacteristic=await service.getCharacteristic(BLE_MIDI_CHARACTERISTIC);
  await bleCharacteristic.startNotifications();
  selectedMidi=midiInputLike(d.name||'SMC-PAD Pocket',`ble:${d.id}`);
  rememberedMidi={id:selectedMidi.id,name:selectedMidi.name,manufacturer:'M-VAVE'};
  try{localStorage.setItem(MIDI_DEVICE_KEY,JSON.stringify(rememberedMidi))}catch{}
  midiActivity.set(selectedMidi.id,Date.now());
  bleCharacteristic.addEventListener('characteristicvaluechanged',event=>{const view=event.target.value;parseBleMidiPacket(selectedMidi,view.buffer.slice(view.byteOffset,view.byteOffset+view.byteLength))});
  renderBleDevices([d]);device.value=selectedMidi.id;
  setMidiStatus(true,automatic?'RECONECTADO':'BLE MIDI CONECTADO');statusText.textContent='SMC-PAD POCKET · LISTO';
 }catch(error){setMidiStatus(false,'SIN CONECTAR');throw error}
 finally{power.disabled=false}
}
async function requestBleDevice(){
 // El selector solo ofrece el Pocket/SMC o dispositivos que anuncien BLE-MIDI.
 return navigator.bluetooth.requestDevice({filters:[{namePrefix:'SMC-PAD'},{namePrefix:'SMC PAD'},{services:[BLE_MIDI_SERVICE]}],optionalServices:[BLE_MIDI_SERVICE]});
}
async function connectBleMidi(){
 if(!navigator.bluetooth){showError('Este navegador no ofrece Web Bluetooth. Usa Chrome o Edge desde HTTPS.');return}
 try{
  power.disabled=true;
  // Primero recupera el dispositivo previamente autorizado, sin escaneo general.
  const authorized=await getAuthorizedBleDevices();
  let target=authorized.find(d=>rememberedMidi?.id===`ble:${d.id}`)||authorized.find(d=>rememberedMidi?.name&&d.name===rememberedMidi.name)||null;
  if(!target)target=await requestBleDevice();
  await attachBleDevice(target,false);
 }catch(error){setMidiStatus(false,'SIN CONECTAR');if(error?.name==='NotFoundError')statusText.textContent='NO SE ENCONTRÓ UN SMC-PAD';else if(error?.name==='NotAllowedError')statusText.textContent='SELECCIÓN CANCELADA';else showError(`No se pudo conectar al SMC-PAD. ${error.message||error}`);power.disabled=false}
}
async function reconnectAuthorizedBle(d){
 // Tras F5 Chrome puede tardar en liberar la conexión GATT de la página anterior.
 // Reintentos limitados: evita ciclos infinitos y no requiere apagar/encender el Pocket.
 const waits=[0,800,1600,2800];let lastError=null;
 for(let attempt=0;attempt<waits.length;attempt++){
  if(waits[attempt])await new Promise(resolve=>setTimeout(resolve,waits[attempt]));
  try{await attachBleDevice(d,true);return true}
  catch(error){lastError=error;}
 }
 throw lastError||new Error('No se pudo restablecer la conexión GATT.');
}
async function restoreAuthorizedBle(){
 if(!navigator.bluetooth?.getDevices)return;
 const devices=await getAuthorizedBleDevices();
 const smc=devices.filter(d=>/^smc[\s-]*pad/i.test(d.name||'')||/^smc[\s-]*mixer/i.test(d.name||''));
 renderBleDevices(smc);
 const last=smc.find(d=>rememberedMidi?.id===`ble:${d.id}`)||smc.find(d=>rememberedMidi?.name&&d.name===rememberedMidi.name);
 if(last&&!midiStarted){
  try{await reconnectAuthorizedBle(last)}
  catch(error){setMidiStatus(false,'SMC RECORDADO · NO CONECTADO');statusText.textContent=`NO SE PUDO RECONECTAR: ${error?.message||error}`;power.disabled=false;}
 }
}
async function initializeMidi(){
 if(navigator.requestMIDIAccess){try{midiAccess=await navigator.requestMIDIAccess({sysex:false});[...midiAccess.inputs.values()].forEach(monitorMidiInput);midiAccess.onstatechange=event=>{const input=event.port;if(input?.type==='input'){if(input.state==='disconnected'){midiActivity.delete(input.id);if(selectedMidi?.id===input.id){selectedMidi=null;setMidiStatus(false,'DISPOSITIVO DESCONECTADO')}}else monitorMidiInput(input)}renderMidiDevices()};}catch(error){/* BLE directo sigue disponible aunque Web MIDI no lo esté. */}}
 if(navigator.bluetooth){power.disabled=false;statusText.textContent='CONSULTANDO DISPOSITIVOS AUTORIZADOS…';await restoreAuthorizedBle();if(!midiStarted)statusText.textContent='LISTO · SELECCIONA O INICIA';}
 else if(midiAccess){renderMidiDevices();power.disabled=!activeMidiInputs().length;statusText.textContent='ESPERANDO ACTIVIDAD MIDI';}
 else{device.innerHTML='<option value="">MIDI no disponible en este navegador</option>';power.disabled=true;statusText.textContent='NAVEGADOR NO COMPATIBLE'}
}
device.onchange=()=>{
 if(midiStarted)disconnectMidi();const value=device.value;
 if(value.startsWith('ble:')){const name=device.selectedOptions[0]?.textContent.split(' · ')[0]||'';rememberedMidi={id:value,name,manufacturer:'M-VAVE'};try{localStorage.setItem(MIDI_DEVICE_KEY,JSON.stringify(rememberedMidi))}catch{}power.disabled=false;return}
 const input=midiAccess?.inputs.get(value);if(input){rememberMidiDevice(input);power.disabled=false}else power.disabled=!navigator.bluetooth;
};
function connectMidi(automatic=false){if(!midiAccess||!device.value)return;const input=midiAccess.inputs.get(device.value);if(!input||input.state==='disconnected'||!midiActivity.has(input.id))return;selectedMidi=input;rememberMidiDevice(input);monitorMidiInput(input);setMidiStatus(true,automatic?'CONECTADO AUTOMÁTICAMENTE':'CONECTADO');const profile=midiProfile(input);statusText.textContent=profile?`${profile.label} · LISTO`:'CONECTADO · PERFIL NO RECONOCIDO'}
function disconnectMidi(){if(bleDevice?.gatt?.connected){bleDevice.gatt.disconnect();return}if(selectedMidi)monitorMidiInput(selectedMidi);selectedMidi=null;setMidiStatus(false,'SIN CONECTAR')}
power.onclick=()=>{if(midiStarted){disconnectMidi();return}const value=device.value;if(value.startsWith('ble:')){connectBleMidi();return}const input=midiAccess?.inputs.get(value);if(input&&midiActivity.has(input.id)){connectMidi();return}if(navigator.bluetooth){connectBleMidi();return}connectMidi()};
// ── CONFIGURACIÓN MAESTRA: permite al móvil volver a cargar el JSON original publicado junto al HTML. ──
async function loadMasterFxConfig(){const button=$('loadFxButton');if(!button)return;button.disabled=true;button.textContent='CARGANDO…';try{const response=await fetch('./show-pad-config.json',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status} al solicitar show-pad-config.json`);const config=await response.json();if(!config||!Array.isArray(config.assignments))throw new Error('El JSON no contiene una lista válida de asignaciones.');applyConfig(config);localStorage.setItem('myrockomix-show-pad-config',JSON.stringify(serializeConfig()));syncPadActionsToEngine();ensurePageButtons();failedPads.clear();failedAudioPaths.clear();renderPads();preloadInitialPages();showError('Configuración maestra cargada. Se actualizaron las asignaciones de tus pads.');}catch(error){console.error('SHOW PAD: no se pudo cargar show-pad-config.json',error);showError('No se pudo cargar la configuración maestra. Comprueba que show-pad-config.json esté publicado junto al HTML y que tengas conexión.')}finally{button.disabled=false;button.textContent='↻ CARGAR FX´S'}}
$('loadFxButton')?.addEventListener('click',loadMasterFxConfig);
// ── INICIO: carga config, pinta hojas y precarga páginas 1 y 2 sin UI de carga. ──
function initializeShowPadInput(){
 if(IS_COMPACT_VIEW){
  if(window.showHost?.onPadTrigger){
   window.showHost.onPadTrigger(executeEnginePadEvent);
   syncPadActionsToEngine();
  }
  return;
 }

}
async function initializeShowPad(){let config=DEFAULT_CONFIG;try{const saved=localStorage.getItem('myrockomix-show-pad-config');if(saved)config=JSON.parse(saved);else{try{const response=await fetch('./show-pad-config.json',{cache:'no-store'});if(response.ok)config=await response.json()}catch{}localStorage.setItem('myrockomix-show-pad-config',JSON.stringify(config))}}catch{config=DEFAULT_CONFIG}await loadPersonalAudios();await requestPersistentStorage();applyConfig(config);ensurePageButtons();renderPads();preloadInitialPages();initializeShowPadInput();restoreConfigFileLink()}
initializeShowPad();
